<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - DashFood</title>
    <meta name="description" content="Connectez-vous à votre compte DashFood">
    <link rel="icon" type="image/png" href="/assets/logos/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <!-- Navbar Premium DashFood -->
    <nav class="login-navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-logo">
                <img src="/assets/logos/logo.png" alt="DashFood" class="logo-img">
            </a>

            <div class="navbar-actions">
                <a href="/register" class="btn-register">S'inscrire</a>
            </div>
        </div>
    </nav>

    <!-- Container principal -->
    <div class="login-container">

        <!-- Colonne gauche - Premium Green -->
        <div class="left-column">
            <div class="left-content">
                <h1 class="left-title">
                    Bon retour<br><span class="left-title-italic">parmi nous</span>.
                </h1>
                <p class="left-subtitle">
                    Votre prochain repas est à portée de clic.
                </p>
            </div>
        </div>

        <!-- Colonne droite - Formulaire -->
        <div class="right-column">
            <div class="form-wrapper">
                <!-- En-tête formulaire -->
                <div class="form-header">
                    <span class="form-label-small">SE CONNECTER</span>
                    <h2 class="form-title">Bienvenue</h2>
                    <p class="form-subtitle">Connectez-vous pour retrouver vos commandes.</p>
                </div>

                <!-- Message d'erreur/succès -->
                <div class="message-banner" id="messageBanner" style="display: none;"></div>

                <!-- Formulaire de connexion -->
                <form id="loginForm" class="login-form">

                    <!-- Email -->
                    <div class="form-group">
                        <label class="form-label">EMAIL •</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            placeholder="vous@exemple.com"
                            required
                        >
                    </div>

                    <!-- Mot de passe -->
                    <div class="form-group">
                        <label class="form-label">MOT DE PASSE •</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-input"
                                placeholder="Votre mot de passe"
                                required
                            >
                            <button type="button" class="toggle-password" data-target="password">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Mot de passe oublié -->
                    <div class="forgot-password">
                        <a href="#">Mot de passe oublié ?</a>
                    </div>

                    <!-- Bouton soumettre -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="submit-text">SE CONNECTER</span>
                        <span class="submit-circle">
                            <svg class="submit-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                    </button>

                    <!-- Lien inscription -->
                    <div class="bottom-link">
                        Pas encore de compte ? <a href="/register">S'inscrire</a>
                    </div>

                </form>
            </div>
        </div>

    </div>

    <script>
        // ===== TOGGLE PASSWORD VISIBILITY =====
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);

                if (input.type === 'password') {
                    input.type = 'text';
                    this.style.opacity = '1';
                } else {
                    input.type = 'password';
                    this.style.opacity = '0.6';
                }
            });
        });

        // ===== FORM SUBMISSION =====
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageBanner = document.getElementById('messageBanner');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // masque le message precedent
            messageBanner.style.display = 'none';

            // recupere les donnees du formulaire
            const formData = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            // desactive le bouton et affiche loading
            submitBtn.disabled = true;
            submitBtn.querySelector('.submit-text').textContent = 'CONNEXION...';
            submitBtn.style.opacity = '0.7';

            try {
                // appel API de connexion
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    // Save token and user to localStorage
                    localStorage.setItem('dashfood_token', data.token);
                    localStorage.setItem('dashfood_user', JSON.stringify(data.user));

                    // succes
                    showMessage('Connexion réussie ! Redirection...', 'success');

                    // Role-based redirection - Système de navigation intelligent
                    setTimeout(() => {
                        const role = data.user.role;
                        const savedRedirect = localStorage.getItem('redirectAfterLogin');
                        const safeRedirect = savedRedirect &&
                            savedRedirect.startsWith('/') &&
                            !savedRedirect.startsWith('//')
                            ? savedRedirect
                            : null;

                        localStorage.removeItem('redirectAfterLogin');

                        switch(role) {
                            case 'client':
                                // Reprendre la navigation demandée avant la connexion.
                                window.location.href = safeRedirect || '/';
                                break;
                            case 'admin':
                                // Les admins accèdent directement à leur dashboard
                                window.location.href = '/admin-dashboard.html';
                                break;
                            case 'restaurant':
                                // Les restaurants accèdent directement à leur dashboard
                                window.location.href = '/restaurant-dashboard.html';
                                break;
                            case 'livreur':
                                // Les livreurs accèdent directement à leur dashboard
                                window.location.href = '/livreur-dashboard.html';
                                break;
                            default:
                                window.location.href = '/';
                        }
                    }, 1000);
                } else {
                    // erreur du serveur
                    showMessage(data.message || 'Email ou mot de passe incorrect.', 'error');

                    // reactive le bouton
                    submitBtn.disabled = false;
                    submitBtn.querySelector('.submit-text').textContent = 'SE CONNECTER';
                    submitBtn.style.opacity = '1';
                }

            } catch (error) {
                console.error('Erreur connexion:', error);
                showMessage('Erreur de connexion au serveur. Veuillez réessayer.', 'error');

                // reactive le bouton
                submitBtn.disabled = false;
                submitBtn.querySelector('.submit-text').textContent = 'SE CONNECTER';
                submitBtn.style.opacity = '1';
            }
        });

        // ===== AFFICHAGE MESSAGE =====
        function showMessage(message, type) {
            messageBanner.textContent = message;
            messageBanner.className = `message-banner ${type}`;
            messageBanner.style.display = 'block';

            // scroll vers le haut pour voir le message
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
