<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - DashFood</title>
    <meta name="description" content="Créez votre compte DashFood et commencez à commander">
    <link rel="icon" type="image/png" href="/assets/logos/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/register.css">
</head>
<body>

    <!-- Navbar Premium DashFood -->
    <nav class="register-navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-logo">
                <img src="/assets/logos/logo.png" alt="DashFood" class="logo-img">
            </a>

            <div class="navbar-actions">
                <a href="/login" class="btn-login">Connexion</a>
            </div>
        </div>
    </nav>

    <!-- Container principal -->
    <div class="register-container">

        <!-- Colonne gauche - Premium Green -->
        <div class="left-column">
            <div class="left-content">
                <h1 class="left-title">
                    Rejoignez <span class="left-title-italic">DashFood</span>.
                </h1>
                <p class="left-subtitle">
                    Commandez, savourez, recommencez.
                </p>
            </div>
        </div>

        <!-- Colonne droite - Formulaire -->
        <div class="right-column">
            <div class="form-wrapper">
                <!-- En-tête formulaire -->
                <div class="form-header">
                    <span class="form-label-small">CRÉER UN COMPTE</span>
                    <h2 class="form-title">Bienvenue</h2>
                    <p class="form-subtitle">Quelques informations et vous êtes prêt à commander.</p>
                </div>

                <!-- Message d'erreur/succès -->
                <div class="message-banner" id="messageBanner" style="display: none;"></div>

                <!-- Formulaire d'inscription -->
                <form id="registerForm" class="register-form">

                    <!-- Nom complet -->
                    <div class="form-group">
                        <label class="form-label">NOM COMPLET •</label>
                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            class="form-input"
                            placeholder="Votre nom et prénom"
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label class="form-label">EMAIL •</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            placeholder="vous@exemple.com"
                            required
                        >
                    </div>

                    <!-- Téléphone et Adresse -->
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">TÉLÉPHONE •</label>
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                class="form-input"
                                placeholder="+212 6 XX XX XX XX"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label class="form-label">ADRESSE •</label>
                            <input
                                type="text"
                                id="address"
                                name="address"
                                class="form-input"
                                placeholder="Votre adresse"
                                required
                            >
                        </div>
                    </div>

                    <!-- Mot de passe -->
                    <div class="form-group">
                        <label class="form-label">MOT DE PASSE •</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-input"
                                placeholder="Minimum 6 caractères"
                                required
                            >
                            <button type="button" class="toggle-password" data-target="password">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Confirmer mot de passe -->
                    <div class="form-group">
                        <label class="form-label">CONFIRMER LE MOT DE PASSE •</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                class="form-input"
                                placeholder="Retapez votre mot de passe"
                                required
                            >
                            <button type="button" class="toggle-password" data-target="confirmPassword">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Bouton soumettre -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="submit-text">CRÉER MON COMPTE</span>
                        <span class="submit-circle">
                            <svg class="submit-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                    </button>

                    <!-- Lien connexion -->
                    <div class="bottom-link">
                        Déjà un compte ? <a href="/login">Se connecter</a>
                    </div>

                </form>
            </div>
        </div>

    </div>

    <script>
        // ===== TOGGLE PASSWORD VISIBILITY =====
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);

                if (input.type === 'password') {
                    input.type = 'text';
                    this.style.opacity = '1';
                } else {
                    input.type = 'password';
                    this.style.opacity = '0.6';
                }
            });
        });

        // ===== FORM SUBMISSION =====
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageBanner = document.getElementById('messageBanner');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // masque le message precedent
            messageBanner.style.display = 'none';

            // recupere les donnees du formulaire
            const formData = {
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                address: document.getElementById('address').value.trim(),
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value
            };

            // validation client basique
            if (!formData.fullName || !formData.email || !formData.phone || !formData.address || !formData.password || !formData.confirmPassword) {
                showMessage('Veuillez remplir tous les champs obligatoires.', 'error');
                return;
            }

            if (formData.password !== formData.confirmPassword) {
                showMessage('Les mots de passe ne correspondent pas.', 'error');
                return;
            }

            if (formData.password.length < 6) {
                showMessage('Le mot de passe doit contenir au moins 6 caractères.', 'error');
                return;
            }

            // desactive le bouton et affiche loading
            submitBtn.disabled = true;
            submitBtn.querySelector('.submit-text').textContent = 'CRÉATION...';
            submitBtn.style.opacity = '0.7';

            try {
                // appel API d'inscription
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    // succes
                    showMessage(data.message + ' Redirection vers la connexion...', 'success');

                    // redirection apres 2 secondes
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    // erreur du serveur
                    showMessage(data.message || 'Une erreur est survenue.', 'error');

                    // reactive le bouton
                    submitBtn.disabled = false;
                    submitBtn.querySelector('.submit-text').textContent = 'CRÉER MON COMPTE';
                    submitBtn.style.opacity = '1';
                }

            } catch (error) {
                console.error('Erreur inscription:', error);
                showMessage('Erreur de connexion au serveur. Veuillez réessayer.', 'error');

                // reactive le bouton
                submitBtn.disabled = false;
                submitBtn.querySelector('.submit-text').textContent = 'CRÉER MON COMPTE';
                submitBtn.style.opacity = '1';
            }
        });

        // ===== AFFICHAGE MESSAGE =====
        function showMessage(message, type) {
            messageBanner.textContent = message;
            messageBanner.className = `message-banner ${type}`;
            messageBanner.style.display = 'block';

            // scroll vers le haut pour voir le message
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
